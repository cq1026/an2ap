<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Console</title>

    <!-- 版本切换：检查用户偏好并自动跳转 -->
    <script>
        (function() {
            var preferred = localStorage.getItem('uiVersion');
            if (!preferred || preferred === 'old') {
                window.location.href = '/index.html';
                return;
            }
        })();
    </script>

    <!-- 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 样式 -->
    <link rel="stylesheet" href="style-new.css">
</head>
<body>
    <div id="root"></div>

    <!-- 全局常量 -->
    <script type="text/babel" src="js-new/constants.js"></script>

    <!-- 基础组件 -->
    <script type="text/babel" src="js-new/icons.jsx"></script>
    <script type="text/babel" src="js-new/context.jsx"></script>
    <script type="text/babel" src="js-new/utils.jsx"></script>
    <script type="text/babel" src="js-new/base-components.jsx"></script>

    <!-- 模态框组件 -->
    <script type="text/babel" src="js-new/modals.jsx"></script>

    <!-- 页面组件 -->
    <script type="text/babel" src="js-new/components/Login.jsx"></script>
    <script type="text/babel" src="js-new/components/Dashboard.jsx"></script>
    <script type="text/babel" src="js-new/components/Settings.jsx"></script>
    <script type="text/babel" src="js-new/components/Logs.jsx"></script>

    <!-- 主应用 -->
    <script type="text/babel" src="js-new/App.jsx"></script>

    <!-- 渲染 -->
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ToastProvider>
                <App />
            </ToastProvider>
        );
    </script>
</body>
</html>
